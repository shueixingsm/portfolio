<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xianglin Qu — Visual Artist</title>
  <meta name="description" content="Visual artist — CG · Real-Time VFX · AI Filmmaking. Selected works 2022—2026.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">

  <!-- Preloader -->
  <div class="preloader" id="preloader" aria-hidden="true">
    <div class="preloader__count" id="preloader-count">00</div>
    <div class="preloader__name" id="preloader-name"></div>
  </div>

  <!-- Custom cursor -->
  <div class="cursor-dot" id="cursor-dot" aria-hidden="true"></div>
  <div class="cursor-ring" id="cursor-ring" aria-hidden="true"></div>

  <!-- Navigation -->
  <header class="nav" id="nav">
    <a class="nav__logo" href="index.html" data-cursor="hover" id="nav-logo"></a>
    <div class="nav__right">
      <nav class="nav__links" aria-label="Primary">
        <a href="index.html#work" class="nav__link is-active" data-cursor="hover">Work</a>
        <a href="about.html" class="nav__link" data-cursor="hover">About</a>
        <a href="mailto:hello@yourname.com" class="nav__link" id="nav-contact" data-cursor="hover">Contact</a>
      </nav>
      <div class="lang-switch" role="group" aria-label="Language">
        <button class="lang-switch__btn" data-lang="en" data-cursor="hover">EN</button>
        <span class="lang-switch__sep">/</span>
        <button class="lang-switch__btn" data-lang="zh" data-cursor="hover">中</button>
      </div>
    </div>
    <button class="nav__burger" id="nav-burger" aria-label="Open menu" aria-expanded="false" data-cursor="hover">
      <span></span><span></span>
    </button>
  </header>

  <!-- Fullscreen menu -->
  <div class="menu" id="menu" aria-hidden="true">
    <div class="menu__inner">
      <a href="index.html" class="menu__link" data-cursor="hover"><span class="menu__num">01</span>Work</a>
      <a href="about.html" class="menu__link" data-cursor="hover"><span class="menu__num">02</span>About</a>
      <a href="#" id="menu-contact" class="menu__link" data-cursor="hover"><span class="menu__num">03</span>Contact</a>
    </div>
    <div class="menu__foot" id="menu-foot"></div>
  </div>

  <main>
    <!-- HERO -->
    <section class="hero" id="hero">
      <canvas class="hero__canvas" id="hero-canvas" aria-hidden="true"></canvas>
      <div class="hero__inner">
        <p class="hero__kicker line-mask"><span id="hero-kicker"></span></p>
        <h1 class="hero__title" id="hero-title" aria-label="Xianglin Qu"></h1>
        <p class="hero__role line-mask"><span id="hero-role"></span></p>
        <p class="hero__sub line-mask"><span id="hero-sub"></span></p>
      </div>
      <div class="hero__foot">
        <span class="hero__foot-item" id="hero-location"></span>
        <span class="hero__foot-item hero__foot-scroll" data-cursor="hover">Scroll<span class="hero__scroll-line"></span></span>
      </div>
    </section>

    <!-- SELECTED WORKS -->
    <section class="featured" id="work">
      <div class="section-head">
        <span class="section-head__label" id="selected-label"></span>
        <span class="section-head__count" id="selected-count"></span>
      </div>
      <div class="featured__list" id="selected-list"><!-- JS --></div>
    </section>

    <!-- EXPLORE BY DISCIPLINE -->
    <section class="disciplines" id="disciplines">
      <div class="section-head">
        <span class="section-head__label" id="explore-label"></span>
        <span class="section-head__count" id="explore-count"></span>
      </div>
      <div class="disc-list" id="disc-list"><!-- JS --></div>
    </section>

    <!-- ABOUT strip -->
    <section class="about-strip" id="about">
      <p class="about-strip__text" id="about-text"></p>
      <a class="btn-magnetic" href="about.html" data-cursor="hover"><span class="btn-magnetic__label">About me</span><span class="btn-magnetic__arrow">→</span></a>
    </section>
  </main>

  <!-- FOOTER -->
  <footer class="footer" id="contact">
    <canvas class="footer__canvas" id="footer-canvas" aria-hidden="true"></canvas>
    <div class="footer__inner">
      <p class="footer__kicker" id="footer-kicker">Contact</p>
      <a class="footer__cta" id="footer-email" href="mailto:hello@yourname.com" data-cursor="hover">Let's talk</a>
      <div class="footer__meta">
        <div class="footer__col">
          <span class="footer__label">Socials</span>
          <div class="footer__socials" id="footer-socials"></div>
        </div>
        <div class="footer__col">
          <span class="footer__label">Local time</span>
          <span class="footer__time" id="footer-time">--:--</span>
        </div>
        <div class="footer__col">
          <span class="footer__label">© <span id="footer-year"></span></span>
          <span class="footer__dim" id="footer-name"></span>
        </div>
      </div>
    </div>
  </footer>

  <script src="assets/vendor/gsap.min.js"></script>
  <script src="assets/vendor/ScrollTrigger.min.js"></script>
  <script src="assets/vendor/lenis.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
